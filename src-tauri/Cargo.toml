[package]
name = "infodock"
version = "0.1.0"
description = "A compact system-information and launcher bar for the desktop"
license = "MIT"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
# Distinct from the binary name: on Windows equal names collide on .pdb files (cargo#8519).
name = "infodock_lib"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "12", features = ["serde-json-impl"] }
fastrand = "2"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
sys-locale = "0.3"
tauri-plugin-single-instance = "2.5"
tauri-plugin-global-shortcut = "2.4"

[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.8"
windows = { version = "0.62", features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true

[dev-dependencies]
tempfile = "3"
