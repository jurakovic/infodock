[package]
name = "infodock"
version = "0.1.0"
description = "A compact system-information and launcher bar for the desktop"
license = "MIT"
edition = "2024"
rust-version = "1.89"
publish = false

[lib]
# Distinct from the binary name: on Windows equal names collide on .pdb files (cargo#8519).
name = "infodock_lib"

# Installer (SPEC §15.3), built with `cargo packager --release --formats nsis`.
[package.metadata.packager]
productName = "Infodock"
identifier = "app.infodock.desktop"
publisher = "jurakovic"
copyright = "Copyright (c) 2026 jurakovic"
category = "Utility"
icons = ["icons/icon.ico"]
formats = ["nsis"]

[package.metadata.packager.nsis]
# Per user, without admin rights: %LOCALAPPDATA%\Infodock, HKCU only (SPEC §15.3).
installMode = "currentUser"
installerIcon = "icons/icon.ico"
# Placeholders until the final artwork (SPEC Appendix C).
headerImage = "icons/installer/header.bmp"
sidebarImage = "icons/installer/sidebar.bmp"
# The template's Start Menu shortcut carries the identifier as its AppUserModelID. This adds an
# uninstaller section, which NSIS runs before the template's own: it removes the sign-in entry
# (`autostart::RUN_VALUE`, SPEC §10.1) and Task Manager's mark for it, except when an upgrade
# runs the old uninstaller (with /P), and the AppUserModelID the app registers (§7.4).
preinstallSection = '''
Section "un.Autostart"
  ClearErrors
  ${GetOptions} $CMDLINE "/P" $R0
  IfErrors 0 +3
    DeleteRegValue HKCU "Software\Microsoft\Windows\CurrentVersion\Run" "Infodock"
    DeleteRegValue HKCU "Software\Microsoft\Windows\CurrentVersion\Explorer\StartupApproved\Run" "Infodock"
  DeleteRegKey HKCU "Software\Classes\AppUserModelId\app.infodock.desktop"
SectionEnd
'''

[build-dependencies]
slint-build = "1.18"
# Windows resources (icon, manifest, version); only used when the target is Windows.
embed-resource = "3"

[dependencies]
# Settings window (SPEC §3): winit backend with the software renderer only.
slint = { version = "1.18", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
    "accessibility",
    "unstable-winit-030",
] }
global-hotkey = "0.8"
# SVG icons and images (SPEC §3). Slint links the same version; its text feature is Slint's.
resvg = { version = "0.48", default-features = false }
# For SVG limits (`platform/bitmap.rs`): .svgz inflated with a cap, and the size of embedded
# rasters. The versions and features usvg already links, so they cost nothing.
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
imagesize = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The legacy XML layout import (SPEC §3, §11.4): the reader only.
quick-xml = "0.42"
fastrand = "2"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

[target.'cfg(windows)'.dependencies]
# Batteries for the `battery/<i>` topic (SPEC Appendix A): charge, state, times, names.
starship-battery = "0.12"
raw-window-handle = "0.6"
window-vibrancy = "0.8"
# Points and matrices of the Direct2D API; the version the `windows` crate uses.
windows-numerics = "0.3"
# The `#[implement]` macro (the bar's `IDropTarget`) names this crate; the version the
# `windows` crate uses.
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Data_Xml_Dom",
    "Wdk_System_SystemInformation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Media_Audio",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WiFi",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_Shutdown",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "UI_Notifications",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true

[dev-dependencies]
png = "0.18"
tempfile = "3"
