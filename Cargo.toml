[package]
name = "infodock"
# Local builds are 0.0.0: publish.sh sets the version for CI builds (<next release>-build.<run>)
# and releases, computed from the tags.
version = "0.0.0"
description = "A compact system-information and launcher bar for the desktop"
license = "MIT"
edition = "2024"
rust-version = "1.89"
publish = false

[lib]
# Distinct from the binary name: on Windows equal names collide on .pdb files (cargo#8519).
name = "infodock_lib"

# Installer, built with `cargo packager --release --formats nsis`.
[package.metadata.packager]
productName = "Infodock"
identifier = "app.infodock.desktop"
publisher = "jurakovic"
copyright = "Copyright (c) 2026 jurakovic"
category = "Utility"
icons = ["icons/icon.ico"]
formats = ["nsis"]

[package.metadata.packager.nsis]
# Per user, without admin rights: %LOCALAPPDATA%\Infodock, HKCU only.
installMode = "currentUser"
installerIcon = "icons/icon.ico"
# Rendered from icons/installer/*.svg by `cargo run --example icons`.
headerImage = "icons/installer/header.bmp"
sidebarImage = "icons/installer/sidebar.bmp"
# The template's Start Menu shortcut carries the identifier as its AppUserModelID. This adds:
# * an installer and an uninstaller section, before the template's own sections, whose check ends
#   a running Infodock with TerminateProcess: when it runs, they ask the template's question (unless the
#   run is silent, or a passive install, as the template does; Cancel stops), then send the bar
#   window (`Infodock.Bar`) WM_CLOSE and wait up to 10 s for the app to quit, which writes its
#   config. The template's check then finds it gone, or ends it after all.
# * an installer section, before the template's own, that writes the sign-in entry
#   (`autostart::RUN_VALUE`) for the installed exe and clears Task Manager's mark for
#   it when the command line has /AUTOSTART (silent deployments); the app's first run
#   takes the entry into its setting.
# * when the installer ends without the exe in place (a failed install, or one closed after the
#   reinstall page removed the old version, which keeps the entry with /P), the entry for that
#   exe is removed.
# * once an uninstall has succeeded: the sign-in entry and Task Manager's mark when the entry
#   names the installed exe, the install location the template keeps under the publisher's
#   key, and the AppUserModelID the app registers; an upgrade (the old uninstaller run
#   with /P) keeps all but the last. NSIS runs `un.onUninstSuccess` only after a finished
#   uninstall, so one cancelled at "Infodock is running" changes nothing.
preinstallSection = '''
!macro InfodockCloseRunning
  nsis_tauri_utils::FindProcess "${MAINBINARYNAME}.exe"
  Pop $R0
  ${If} $R0 = 0
    IfSilent infodock_close 0
    ${IfThen} $PassiveMode != 1 ${|} MessageBox MB_OKCANCEL "$(appRunningOkKill)" IDOK infodock_close IDCANCEL infodock_cancel ${|}
    infodock_close:
      FindWindow $R1 "Infodock.Bar"
      ${If} $R1 <> 0
        ; WM_CLOSE
        SendMessage $R1 16 0 0 /TIMEOUT=5000
        StrCpy $R2 0
        ${Do}
          Sleep 250
          nsis_tauri_utils::FindProcess "${MAINBINARYNAME}.exe"
          Pop $R0
          IntOp $R2 $R2 + 1
          ${If} $R0 <> 0
          ${OrIf} $R2 >= 40
            ${ExitDo}
          ${EndIf}
        ${Loop}
      ${EndIf}
      Goto infodock_closed
    infodock_cancel:
      Abort "$(appRunning)"
  ${EndIf}
  infodock_closed:
!macroend

Section "-CloseRunning"
  !insertmacro InfodockCloseRunning
SectionEnd

Section "-un.CloseRunning"
  !insertmacro InfodockCloseRunning
SectionEnd

Section "-Autostart"
  ClearErrors
  ${GetOptions} $CMDLINE "/AUTOSTART" $R0
  ${IfNot} ${Errors}
    WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Run" "Infodock" '"$INSTDIR\${MAINBINARYNAME}.exe"'
    DeleteRegValue HKCU "Software\Microsoft\Windows\CurrentVersion\Explorer\StartupApproved\Run" "Infodock"
  ${EndIf}
SectionEnd

Function RemoveDeadAutostart
  ReadRegStr $R0 HKCU "Software\Microsoft\Windows\CurrentVersion\Run" "Infodock"
  ${If} $R0 == '"$INSTDIR\${MAINBINARYNAME}.exe"'
  ${AndIfNot} ${FileExists} "$INSTDIR\${MAINBINARYNAME}.exe"
    DeleteRegValue HKCU "Software\Microsoft\Windows\CurrentVersion\Run" "Infodock"
    DeleteRegValue HKCU "Software\Microsoft\Windows\CurrentVersion\Explorer\StartupApproved\Run" "Infodock"
  ${EndIf}
FunctionEnd

Function .onInstFailed
  Call RemoveDeadAutostart
FunctionEnd

Function .onGUIEnd
  Call RemoveDeadAutostart
FunctionEnd

Function un.onUninstSuccess
  ClearErrors
  ${GetOptions} $CMDLINE "/P" $R0
  ${If} ${Errors}
    ReadRegStr $R0 HKCU "Software\Microsoft\Windows\CurrentVersion\Run" "Infodock"
    ${If} $R0 == '"$INSTDIR\${MAINBINARYNAME}.exe"'
      DeleteRegValue HKCU "Software\Microsoft\Windows\CurrentVersion\Run" "Infodock"
      DeleteRegValue HKCU "Software\Microsoft\Windows\CurrentVersion\Explorer\StartupApproved\Run" "Infodock"
    ${EndIf}
    DeleteRegKey HKCU "${MANUPRODUCTKEY}"
    DeleteRegKey /ifempty HKCU "Software\${MANUFACTURER}"
  ${EndIf}
  DeleteRegKey HKCU "Software\Classes\AppUserModelId\app.infodock.desktop"
FunctionEnd
'''

[build-dependencies]
slint-build = "1.18"
# Windows resources (icon, manifest, version); only used when the target is Windows.
embed-resource = "3"

[dependencies]
# Settings window: winit backend with the software renderer only.
slint = { version = "1.18", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
    "accessibility",
    "unstable-winit-030",
] }
global-hotkey = "0.8"
# SVG icons and images. Slint links the same version; its text feature is Slint's.
resvg = { version = "0.48", default-features = false }
# For SVG limits (`platform/bitmap.rs`): .svgz inflated with a cap, and the size of embedded
# rasters. The versions and features usvg already links, so they cost nothing.
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
imagesize = "0.15"
# The Settings window's native handle, for dialogs modal to it; the version winit links.
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The legacy XML layout import: the reader only.
quick-xml = "0.42"
fastrand = "2"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

[target.'cfg(windows)'.dependencies]
# Batteries for the `battery/<i>` topic: charge, state, times, names.
starship-battery = "0.12"
# Points and matrices of the Direct2D API; the version the `windows` crate uses.
windows-numerics = "0.3"
# The `#[implement]` macro (the bar's `IDropTarget`) names this crate; the version the
# `windows` crate uses.
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Data_Xml_Dom",
    "Security_Authorization_AppCapabilityAccess",
    "Wdk_System_SystemInformation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Media_Audio",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WiFi",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Shutdown",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "UI_Notifications",
    "UI_ViewManagement",
] }

# Renders the raster artwork from its SVGs: `cargo run --example icons`. Its
# tests run with the others and check the committed files against the SVGs.
[[example]]
name = "icons"
test = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true

[dev-dependencies]
png = "0.18"
tempfile = "3"
# The Settings accessibility test walks the window's elements and follows the keyboard focus:
# Slint's testing backend and its core, at the version `slint` uses.
i-slint-backend-testing = "=1.18.1"
i-slint-core = { version = "=1.18.1", default-features = false, features = ["std"] }
