[package]
name = "infodock"
version = "0.1.0"
description = "A compact system-information and launcher bar for the desktop"
license = "MIT"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
# Distinct from the binary name: on Windows equal names collide on .pdb files (cargo#8519).
name = "infodock_lib"

# Installer (SPEC §15.3), built with `cargo packager --release --formats nsis`.
[package.metadata.packager]
productName = "Infodock"
identifier = "app.infodock.desktop"
publisher = "jurakovic"
copyright = "Copyright (c) 2026 jurakovic"
category = "Utility"
icons = ["icons/icon.ico"]
formats = ["nsis"]

[package.metadata.packager.nsis]
installMode = "currentUser"

[build-dependencies]
slint-build = "1.18"
# Windows resources (icon, manifest, version); only used when the target is Windows.
embed-resource = "3"

[dependencies]
# Settings window (SPEC §3): winit backend with the software renderer only.
slint = { version = "1.18", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
    "accessibility",
    "unstable-winit-030",
] }
global-hotkey = "0.8"
# SVG icons and images (SPEC §3). Slint links the same version; its text feature is Slint's.
resvg = { version = "0.48", default-features = false }
# For SVG limits (`platform/bitmap.rs`): .svgz inflated with a cap, and the size of embedded
# rasters. The versions and features usvg already links, so they cost nothing.
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
imagesize = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fastrand = "2"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
window-vibrancy = "0.8"
# Points and matrices of the Direct2D API; the version the `windows` crate uses.
windows-numerics = "0.3"
windows = { version = "0.62", features = [
    "Wdk_System_SystemInformation",
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true

[dev-dependencies]
png = "0.18"
tempfile = "3"
