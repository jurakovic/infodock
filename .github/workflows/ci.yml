name: CI

on:
  push:
    branches: [master]
    # Only changes that can affect the build, lints or tests; docs-only commits skip CI.
    paths:
      - "src/**"
      - "ui/**"
      - "i18n/**"
      - "icons/**"
      - "assets/**"
      - "resources/**"
      - "tests/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - ".github/workflows/ci.yml"
      - ".github/scripts/**"
  pull_request:
    paths:
      - "src/**"
      - "ui/**"
      - "i18n/**"
      - "icons/**"
      - "assets/**"
      - "resources/**"
      - "tests/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - ".github/workflows/ci.yml"
      - ".github/scripts/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Lint & test (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      # Slint's font lookup links fontconfig on Linux.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  windows:
    name: Build & test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test
      # Includes rendering the Settings pages and the bar to target/screenshots.
      - name: Windows integration tests
        run: cargo test -- --ignored --skip budget_
      # The time budgets the app cannot log (SPEC §14.1), one test at a time so they do not
      # compete for the processors; the memory check reads their records.
      - name: Budget tests
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force target/budgets -ErrorAction SilentlyContinue
          cargo test budget_ -- --ignored --test-threads=1 --nocapture
      - name: Build release
        run: cargo build --release
      # Pinned: the installer's uninstaller section (Cargo.toml) relies on its NSIS template.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager@0.11.8
      - name: Build installer
        run: cargo packager --release --formats nsis
      - uses: actions/upload-artifact@v6
        with:
          name: infodock-windows-installer
          path: target/release/*-setup.exe
          if-no-files-found: error
          retention-days: 30
      # Portable build (SPEC §15.3): a single self-contained exe.
      - uses: actions/upload-artifact@v6
        with:
          name: infodock-windows-portable
          path: target/release/infodock.exe
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v6
        with:
          name: infodock-screenshots
          path: target/screenshots
          if-no-files-found: ignore
          retention-days: 14
      # Memory, idle CPU and time budgets (SPEC §14.1), enforced.
      - name: Memory, CPU and time check
        shell: pwsh
        run: .github/scripts/measure-memory.ps1 -Exe target/release/infodock.exe -OutDir "$env:RUNNER_TEMP/memory-check" -Measured target/budgets -Enforce
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: infodock-memory-check
          path: ${{ runner.temp }}/memory-check
          if-no-files-found: ignore
          retention-days: 14
      # The installer per user without admin rights (SPEC §15.3): installed silently, checked,
      # started and uninstalled. After the memory check, whose config it removes.
      - name: Installer check
        shell: pwsh
        run: .github/scripts/check-installer.ps1 -Setup (Get-Item target/release/*-setup.exe).FullName -OutDir "$env:RUNNER_TEMP/installer-check"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: infodock-installer-check
          path: ${{ runner.temp }}/installer-check
          if-no-files-found: ignore
          retention-days: 14
