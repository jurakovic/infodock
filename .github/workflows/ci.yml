name: CI

on:
  push:
    branches: [master]
    # Only changes that can affect the build, lints or tests; docs-only commits skip CI.
    paths:
      - "src/**"
      - "src-tauri/**"
      - "tests/**"
      - "eslint/**"
      - ".cargo/**"
      - "index.html"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "vite.config.ts"
      - "svelte.config.js"
      - "eslint.config.js"
      - ".github/workflows/ci.yml"
      - ".github/scripts/**"
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "tests/**"
      - "eslint/**"
      - ".cargo/**"
      - "index.html"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "vite.config.ts"
      - "svelte.config.js"
      - "eslint.config.js"
      - ".github/workflows/ci.yml"
      - ".github/scripts/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Lint & test (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run lint
      - run: bun run test
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Generated TypeScript bindings are up to date
        shell: bash
        run: |
          changes="$(git status --porcelain -- src/lib/bindings)"
          if [ -n "$changes" ]; then echo "$changes"; echo "Run cargo test and commit src/lib/bindings"; exit 1; fi

  windows:
    name: Build & test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Windows integration tests
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --ignored
      - name: Build installer
        run: bun run tauri build --bundles nsis
      - uses: actions/upload-artifact@v6
        with:
          name: infodock-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
      # Portable build (SPEC §15.3): the frontend is embedded, so the exe runs on its own.
      - uses: actions/upload-artifact@v6
        with:
          name: infodock-windows-portable
          path: src-tauri/target/release/infodock.exe
          if-no-files-found: error
          retention-days: 30
      # Memory budget (SPEC §14.1): reported until M1 S12, enforced from then on.
      - name: Memory check
        shell: pwsh
        run: .github/scripts/measure-memory.ps1 -Exe src-tauri/target/release/infodock.exe -OutDir "$env:RUNNER_TEMP/memory-check"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: infodock-memory-check
          path: ${{ runner.temp }}/memory-check
          if-no-files-found: ignore
          retention-days: 14
