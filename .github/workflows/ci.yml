name: CI

on:
  push:
    branches: [master]
    # Only changes that can affect the build, lints or tests; docs-only commits skip CI.
    paths:
      - "src-tauri/**"
      - "tests/**"
      - ".cargo/**"
      - ".github/workflows/ci.yml"
      - ".github/scripts/**"
  pull_request:
    paths:
      - "src-tauri/**"
      - "tests/**"
      - ".cargo/**"
      - ".github/workflows/ci.yml"
      - ".github/scripts/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Lint & test (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      # Slint's font lookup links fontconfig on Linux.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  windows:
    name: Build & test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      # Includes rendering the Settings pages to src-tauri/target/screenshots.
      - name: Windows integration tests
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --ignored
      - name: Build release
        run: cargo build --manifest-path src-tauri/Cargo.toml --release
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager
      - name: Build installer
        run: cargo packager --manifest-path src-tauri/Cargo.toml --release --formats nsis
      - uses: actions/upload-artifact@v6
        with:
          name: infodock-windows-installer
          path: src-tauri/target/release/*-setup.exe
          if-no-files-found: error
          retention-days: 30
      # Portable build (SPEC §15.3): a single self-contained exe.
      - uses: actions/upload-artifact@v6
        with:
          name: infodock-windows-portable
          path: src-tauri/target/release/infodock.exe
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v6
        with:
          name: infodock-settings-screenshots
          path: src-tauri/target/screenshots
          if-no-files-found: ignore
          retention-days: 14
      # Memory budget (SPEC §14.1): reported until M1 S12, enforced from then on.
      - name: Memory check
        shell: pwsh
        run: .github/scripts/measure-memory.ps1 -Exe src-tauri/target/release/infodock.exe -OutDir "$env:RUNNER_TEMP/memory-check"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: infodock-memory-check
          path: ${{ runner.temp }}/memory-check
          if-no-files-found: ignore
          retention-days: 14
