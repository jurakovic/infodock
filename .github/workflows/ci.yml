name: CI

on:
  push:
    branches: [master]
    # Only changes that can affect the build, lints or tests; docs-only commits skip CI.
    paths:
      - "src/**"
      - "ui/**"
      - "i18n/**"
      - "icons/**"
      - "assets/**"
      - "resources/**"
      - "tests/**"
      - "build.rs"
      - "publish.sh"
      - ".gitattributes"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - ".github/workflows/ci.yml"
      - ".github/scripts/**"
  pull_request:
    paths:
      - "src/**"
      - "ui/**"
      - "i18n/**"
      - "icons/**"
      - "assets/**"
      - "resources/**"
      - "tests/**"
      - "build.rs"
      - "publish.sh"
      - ".gitattributes"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - ".github/workflows/ci.yml"
      - ".github/scripts/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Lint & test (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      # Slint's font lookup links fontconfig on Linux.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  windows:
    name: Build & test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The version is computed from the tags
          fetch-depth: 0
      # <next release>-build.<run number>, e.g. 1.0.1-build.42: the version the Publish workflow
      # would release from master next, marked as a build of it (SPEC §15.3).
      - name: Compute version
        shell: bash
        run: |
          if ! NEXT=$(./publish.sh version -p false); then
            echo "$NEXT"
            echo "::error::Could not compute the version"
            exit 1
          fi
          echo "VERSION=$NEXT-build.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test
      # Includes rendering the Settings pages and the bar to target/screenshots.
      - name: Windows integration tests
        run: cargo test -- --ignored --skip budget_
      # The time budgets the app cannot log (SPEC §14.1), one test at a time so they do not
      # compete for the processors; the memory check reads their records.
      - name: Budget tests
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force target/budgets -ErrorAction SilentlyContinue
          cargo test budget_ -- --ignored --test-threads=1 --nocapture
      # Pinned: the installer's uninstaller section (Cargo.toml) relies on its NSIS template.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager@0.11.8
      # infodock.exe and the installer with the version, as releases are built; the tests ran above.
      - name: Build release and installer
        shell: bash
        run: |
          ./publish.sh build -v "$VERSION" -u true -t false
          echo "### Infodock $VERSION" >> "$GITHUB_STEP_SUMMARY"
      # The artifacts are named like the release files (SPEC §15.3). cargo-packager names the
      # installer infodock_<version>_x64-setup.exe; a copy carries the release's name.
      - name: Name the installer
        shell: bash
        run: |
          shopt -s nullglob
          setups=(target/release/*_x64-setup.exe)
          if [ "${#setups[@]}" -ne 1 ]; then
            echo "::error::Expected one installer in target/release, found ${#setups[@]}"
            exit 1
          fi
          mkdir -p target/ci
          cp "${setups[0]}" "target/ci/Infodock_v${VERSION}_win-x64-setup.exe"
      # Uploaded unzipped, so it downloads as the exe; the artifact takes the file's name.
      - uses: actions/upload-artifact@v7
        with:
          path: target/ci/Infodock_v${{ env.VERSION }}_win-x64-setup.exe
          archive: false
          if-no-files-found: error
          retention-days: 30
      # Portable build (SPEC §15.3): a single self-contained exe, downloaded as
      # Infodock_v<version>_win-x64.zip like the release's.
      - uses: actions/upload-artifact@v7
        with:
          name: Infodock_v${{ env.VERSION }}_win-x64
          path: target/release/infodock.exe
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          name: Infodock_v${{ env.VERSION }}_screenshots
          path: target/screenshots
          if-no-files-found: ignore
          retention-days: 14
      # Memory, idle CPU and time budgets (SPEC §14.1), enforced.
      - name: Memory, CPU and time check
        shell: pwsh
        run: .github/scripts/measure-memory.ps1 -Exe target/release/infodock.exe -OutDir "$env:RUNNER_TEMP/memory-check" -Measured target/budgets -Enforce
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Infodock_v${{ env.VERSION }}_memory-check
          path: ${{ runner.temp }}/memory-check
          if-no-files-found: ignore
          retention-days: 14
      # The installer per user without admin rights (SPEC §15.3): installed silently, checked,
      # started and uninstalled. After the memory check, whose config it removes.
      - name: Installer check
        shell: pwsh
        run: .github/scripts/check-installer.ps1 -Setup (Get-Item target/release/*-setup.exe).FullName -OutDir "$env:RUNNER_TEMP/installer-check"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Infodock_v${{ env.VERSION }}_installer-check
          path: ${{ runner.temp }}/installer-check
          if-no-files-found: ignore
          retention-days: 14
